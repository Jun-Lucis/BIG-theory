name: Publish BIG research-status release (October 2026)

# Single-purpose release workflow. GitHub does not rerun it for ordinary
# research commits; only changes to this exact workflow path trigger it.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-status-2026-10.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Jun-Lucis/BIG-theory'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact repository snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create tag and publish GitHub Release exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="status-2026-10"
          REPO="$GITHUB_REPOSITORY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Existing $TAG tag points at a different commit ($TAG_COMMIT). Refusing to move it."
              exit 1
            fi
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "BIG Research Status — Through B41 (October 2026)"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "GitHub Release already exists; leaving it untouched."
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --verify-tag \
              --title "BIG Research Status — Through B41 (October 2026)" \
              --notes-file "docs/releases/status-2026-10.md" \
              --latest
          fi
          gh release view "$TAG" --repo "$REPO" --json url,tagName,isDraft,isPrerelease,publishedAt
